version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
    ignore:
      # 大版本跳跃可能破坏打包链（尤其 upload/download-artifact 需配套），
      # 只接收小版本与补丁更新，主版本升级由人工评估。
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
