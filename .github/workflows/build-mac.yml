name: Build mac

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install locked backend dependencies
        run: uv sync --extra build --locked
      - name: Validate release version
        run: uv run python tools/release.py validate
      - name: Build and stage complete runtime
        run: uv run python build-app.py
      - name: Install locked frontend dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        working-directory: desktop
        run: pnpm build
      - name: Package application
        working-directory: desktop
        run: pnpm electron-builder build --mac --config --publish never
      - name: Smoke test final packaged resources
        run: uv run python tools/smoke_package.py "desktop/dist-electron/mac-arm64/Score Trans.app/Contents/Resources"
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: score-trans-mac-arm64
          path: |
            desktop/dist-electron/*.dmg
            desktop/dist-electron/*.zip
          if-no-files-found: error
          retention-days: 14
