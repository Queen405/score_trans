name: Build Windows

# Produces a Windows x64 NSIS installer for Score Trans.
# Mirrors the 5 stages of build-app.py on a `windows-latest` runner:
#   1. PyInstaller backend  -> dist/backend/ (backend.exe)
#   2. Audiveris compile    -> third_party/audiveris/app/build/ (ProgramId + classes)
#   3. Stage build-resources (backend, audiveris, bundled JDK 25, gradle dist)
#   4. electron-vite build  -> desktop/out/
#   5. electron-builder --win -> desktop/dist-electron/*.exe
#
# The installer uses the custom beautified NSIS wizard committed under
# desktop/build/installer/ (wired via `nsis.script` in electron-builder.yml),
# NOT electron-builder's default MUI2 installer.
#
# The .exe is NOT code-signed (no Authenticode certificate). Windows SmartScreen
# may warn on first run; users click "More info" -> "Run anyway".

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/**'
      - 'desktop/**'
      - 'third_party/audiveris/**'
      - 'pyinstaller.spec'
      - 'pyinstaller_entry.py'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write   # needed only for the tag-gated `gh release upload` step

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python & uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          python-version: '3.13'

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install backend dependencies
        run: uv sync --extra build --locked

      - name: Validate published_defaults.json
        shell: bash
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("backend/score_trans/config/published_defaults.json").read_text("utf-8"))
          assert data.get("version") == 1, f"version must be 1, got {data.get('version')!r}"
          private = ("api_key", "token", "password", "secret", "credential")
          abs_path = __import__("re").compile(r"^[A-Za-z]:[\\/]|^/|^~|/Users/|\\\\")
          def walk(o, trail=""):
              if isinstance(o, dict):
                  for k, v in o.items():
                      assert not any(f in str(k).lower() for f in private), f"private field {trail}.{k}"
                      walk(v, f"{trail}.{k}")
              elif isinstance(o, list):
                  for i, it in enumerate(o):
                      walk(it, f"{trail}[{i}]")
              elif isinstance(o, str):
                  assert not abs_path.search(o), f"absolute path at {trail}={o!r}"
          walk(data)
          print("published_defaults.json OK")
          PY

      # Stage 1 — PyInstaller backend
      - name: Build backend (PyInstaller)
        run: uv run python -m PyInstaller pyinstaller.spec --noconfirm

      - name: Assemble build-resources/backend
        shell: bash
        run: |
          mkdir -p build-resources/backend
          # -L derefs symlinks so the bundle is self-contained
          cp -rL dist/backend/. build-resources/backend/
          cp backend/score_trans/config/env.example build-resources/backend/.env
          cp backend/score_trans/config/published_defaults.json build-resources/backend/published_defaults.json
          echo "=== build-resources/backend ==="
          ls -la build-resources/backend

      # Stage 2 — Compile Audiveris (repo ships only sources; app/build/ is gitignored)
      - name: Compile Audiveris
        working-directory: third_party/audiveris
        shell: bash
        run: ./gradlew.bat :app:compileJava --no-daemon --console=plain

      - name: Validate Audiveris build artifacts
        shell: bash
        run: |
          AU="third_party/audiveris/app/build"
          PID="$AU/generated-src/org/audiveris/omr/ProgramId.java"
          [ -f "$PID" ] || { echo "FAIL: ProgramId.java missing"; exit 1; }
          grep -q "public abstract class ProgramId" "$PID" || { echo "FAIL: ProgramId.java corrupted"; exit 1; }
          [ -f "$AU/commit.properties" ] || { echo "FAIL: commit.properties missing (generateProgramId will re-run on end-user)"; exit 1; }
          CLASSES=$(find "$AU/classes" -name '*.class' 2>/dev/null | wc -l | tr -d ' ')
          [ "$CLASSES" -gt 1000 ] || { echo "FAIL: too few .class ($CLASSES)"; exit 1; }
          echo "Audiveris build OK ($CLASSES classes)"

      - name: Stage Audiveris into build-resources
        shell: bash
        run: |
          mkdir -p build-resources/third_party/audiveris
          # macOS flow uses `rsync -aL --exclude '.gradle' --exclude 'app/bin'`;
          # Git Bash on Windows has no rsync, so copy everything (incl. compiled
          # app/build) then prune the dev-only dirs to reach the same result.
          cp -rL third_party/audiveris/. build-resources/third_party/audiveris/
          rm -rf build-resources/third_party/audiveris/.gradle \
                 build-resources/third_party/audiveris/app/.gradle \
                 build-resources/third_party/audiveris/app/bin
          chmod +x build-resources/third_party/audiveris/gradlew 2>/dev/null || true
          # Reject leftover Tesseract/Leptonica artifacts
          if find build-resources/third_party/audiveris \( -iname '*tesseract*' -o -iname '*leptonica*' -o -iname '*.traineddata' \) | grep -q .; then
            echo "FAIL: Tesseract artifacts present"; exit 1
          fi
          echo "=== audiveris staged ==="
          du -sh build-resources/third_party/audiveris

      - name: Stage bundled JDK 25
        shell: pwsh
        run: |
          $dest = "build-resources\third_party\jre\jdk"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          # robocopy is the robust choice for large trees on Windows; Copy-Item
          # with a wildcard source into a non-existent path turns the dest into a
          # leaf file ("Container cannot be copied onto existing leaf item").
          robocopy $env:JAVA_HOME $dest /E /NFL /NDL /NJH /NJS /NP
          # robocopy exit codes 0-7 are success (1 = files copied, 2 = extras,
          # 3 = both, ...); 8+ = error. GitHub Actions treats non-zero as
          # failure, so normalize the success range back to 0.
          if ($LASTEXITCODE -ge 8) {
            Write-Error "robocopy failed with exit code $LASTEXITCODE"
            exit 1
          }
          $LASTEXITCODE = 0
          if (-not (Test-Path "$dest\bin\java.exe")) {
            Write-Error "FAIL: java.exe missing after JDK staging"; exit 1
          }
          Write-Host "=== JDK staged ==="
          $size = (Get-ChildItem -Recurse $dest |
                    Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host ("JDK size: {0:N1} MB" -f $size)

      - name: Pre-cache Gradle distribution (offline end-user run)
        shell: bash
        run: |
          VER=$(grep -m1 'distributionUrl=' third_party/audiveris/gradle/wrapper/gradle-wrapper.properties \
                | sed -E 's#.*gradle-([0-9.]+)-bin\.zip.*#\1#')
          SRC="$HOME/.gradle/wrapper/dists/gradle-${VER}-bin"
          DST="build-resources/third_party/gradle_home/wrapper/dists/gradle-${VER}-bin"
          if [ -d "$SRC" ]; then
            mkdir -p "$DST"
            cp -rL "$SRC"/. "$DST"/
            echo "Gradle ${VER} dist cached -> $DST"
          else
            echo "::warning::Gradle dist not found at $SRC; end users will download on first run"
          fi

      # Stage 4 — Electron frontend
      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Build frontend (electron-vite)
        working-directory: desktop
        run: pnpm build

      # Stage 5 — electron-builder (custom beautified NSIS installer)
      - name: Package app (electron-builder --win)
        working-directory: desktop
        run: pnpm electron-builder build --win --config

      - name: List outputs
        shell: bash
        run: |
          echo "=== dist-electron ==="
          ls -la desktop/dist-electron/ || true
          find desktop/dist-electron -maxdepth 2 -type f -name '*.exe' -print -exec ls -la {} \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: score-trans-windows-x64
          path: |
            desktop/dist-electron/*.exe
            desktop/dist-electron/*.blockmap
          if-no-files-found: error
          retention-days: 14

      - name: Publish to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # The first tag build to finish creates the release; the other
          # platform's build finds it already exists and falls back to just
          # uploading its assets. set -e is satisfied: a failed create inside
          # a `||` list does not abort the script.
          gh release create "${GITHUB_REF_NAME}" desktop/dist-electron/*.exe \
            --title "${GITHUB_REF_NAME}" \
            --notes "Score Trans ${GITHUB_REF_NAME} - Windows x64 + macOS arm64" \
            || gh release upload "${GITHUB_REF_NAME}" desktop/dist-electron/*.exe --clobber
