name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install backend dependencies
        run: uv sync --extra test --locked

      - name: Lint backend
        run: uvx ruff@0.15.22 check backend tests scripts

      - name: Check backend formatting
        run: uvx ruff@0.15.22 format --check backend tests scripts

      - name: Test backend
        run: uv run pytest

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        working-directory: desktop
        run: pnpm lint

      - name: Check frontend types
        working-directory: desktop
        run: pnpm typecheck

      - name: Test frontend utilities
        working-directory: desktop
        run: pnpm test:utils

      - name: Check generated API contracts
        working-directory: desktop
        run: pnpm check:api-types

      - name: Build frontend
        working-directory: desktop
        run: pnpm build
