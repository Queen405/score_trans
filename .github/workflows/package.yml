name: Package and release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mode:
        description: Build both platforms, or resume a snapshot from the default branch
        type: choice
        options: [build, resume]
        default: build
      release_tag:
        description: Existing vX.Y.Z snapshot to resume (resume mode only)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  quality:
    if: inputs.mode != 'resume'
    uses: ./.github/workflows/ci.yml
  windows:
    needs: quality
    uses: ./.github/workflows/build-windows.yml
  mac:
    needs: quality
    uses: ./.github/workflows/build-mac.yml
  release:
    if: startsWith(github.ref, 'refs/tags/') && inputs.mode != 'resume'
    needs: [quality, windows, mac]
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
  resume:
    if: inputs.mode == 'resume'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      mode: resume
      release_tag: ${{ inputs.release_tag }}
    secrets: inherit
