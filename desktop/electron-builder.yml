appId: com.scoretrans.app
productName: Score Trans
directories:
  output: dist-electron
  buildResources: build
files:
  - "out/**/*"
  - "package.json"
extraResources:
  - from: "../build-resources/backend"
    to: "backend"
  - from: "../build-resources/third_party"
    to: "third_party"
win:
  target: nsis
  icon: build/icon.ico
  signtoolOptions:
    publisherName: queen
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
