[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "score-trans"
version = "0.1.0"
description = "Staff notation and Jianpu conversion backend for the Electron desktop app"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "pymupdf>=1.25",
    "mido>=1.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
build = ["pyinstaller>=6", "pywin32>=306"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
